name: Deploy

# Manual deploy: Actions tab → Deploy → Run workflow → pick an app.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST     server IP or hostname
#   VPS_USER     SSH user on the server, e.g. deploy
#   VPS_SSH_KEY  private key whose public half is in that user's ~/.ssh/authorized_keys
#   APP_DIR      where the repo is cloned on the server, e.g. /home/deploy/lab
on:
  workflow_dispatch:
    inputs:
      app:
        description: App folder to deploy
        type: choice
        options:
          - django_email_app
          - noded
          - dotnet_email_app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP
          script: |
            set -e
            cd "${{ secrets.APP_DIR }}"
            git pull --ff-only
            cd "$APP"
            docker compose up -d --build
            docker compose ps
        env:
          APP: ${{ inputs.app }}
