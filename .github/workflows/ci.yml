name: CI

# Builds each app with Docker Compose, starts it, and checks it answers on
# its 127.0.0.1 port — the same steps as a real deploy, minus Caddy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  django:
    name: django_email_app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_email_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check
        env:
          SECRET_KEY: ci-only-not-secret
          DJANGO_ALLOWED_HOSTS: localhost

      - name: Create a CI .env
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=ci-$(openssl rand -hex 32)/" .env
          sed -i "s/^DJANGO_ALLOWED_HOSTS=.*/DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1/" .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build and start
        run: docker compose up -d --build

      - name: Smoke test
        run: bash ../.github/scripts/wait-for-http.sh http://127.0.0.1:8000/

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down

  noded:
    name: noded
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noded
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: noded/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js && node --check db.js

      - name: Create CI .env and empty database
        run: |
          cp .env.example .env
          cp db.json.example db.json

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build and start
        run: docker compose up -d --build

      - name: Smoke test
        run: bash ../.github/scripts/wait-for-http.sh http://127.0.0.1:3000/

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down

  dotnet:
    name: dotnet_email_app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet_email_app
    steps:
      - uses: actions/checkout@v4

      - name: Create CI .env and data folder
        run: |
          cp .env.example .env
          mkdir -p data

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build and start
        run: docker compose up -d --build

      - name: Smoke test
        run: bash ../.github/scripts/wait-for-http.sh http://127.0.0.1:8081/ 45

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down
