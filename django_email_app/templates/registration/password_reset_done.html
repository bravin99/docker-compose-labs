{% extends "base.html" %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<div class="card">
    <h1>Check your email</h1>
    <p class="muted">
        If an account with that email exists, we've sent a link to reset your
        password. The link is valid for a limited time.
    </p>
    <div class="links">
        <a href="{% url 'login' %}">Back to login</a>
    </div>
</div>
{% endblock %}
